<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You</title>

<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}

body{
  overflow:hidden;
  font-family:'Cormorant Garamond',serif;
  cursor:none;
}

canvas{position:fixed;inset:0;}

#sentence{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-40%);
  text-align:center;
  font-size:1.6rem;
  color:#e8f4ff;
  opacity:0;
  transition:all 0.9s cubic-bezier(0.22,1,0.36,1);
}

/* styles from your other file */
#sentence.name{
  font-size:2.8rem;
  font-style:italic;
  color:#b3e5fc;
  letter-spacing:0.08em;
}

#sentence.emphasis{
  font-size:2rem;
  font-style:italic;
  color:#9b5de5;

  text-shadow:
    0 0 10px rgba(155,93,229,0.6),
    0 0 25px rgba(155,93,229,0.4),
    0 0 50px rgba(155,93,229,0.25);

  animation: glowPulse 2.5s ease-in-out infinite;
}

@keyframes glowPulse{
  0%,100%{opacity:1}
  50%{opacity:0.85}
}

#sentence.visible{
  opacity:1;
  transform:translate(-50%,-50%);
}

#sentence.exit{
  opacity:0;
  transform:translate(-50%,-60%);
}

/* photo */
#photo-screen{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:#020b18;
  opacity:0;
  transition:1.8s ease;
}
#photo-screen.show{opacity:1}

#photo-frame{
  width:280px;
  height:360px;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 0 90px rgba(79,195,247,0.5);
  animation:float 6s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-12px)}
}

#photo-img{width:100%;height:100%;object-fit:cover;}

/* sparkles */
.sparkle{
  position:fixed;
  pointer-events:none;
  border-radius:50%;
  background:radial-gradient(circle,#b3e5fc,#4fc3f7);
  animation:sparkleFade 1s ease-out forwards;
}
@keyframes sparkleFade{
  0%{opacity:1; transform:scale(1)}
  100%{opacity:0; transform:scale(0.2)}
}

/* hearts */
.heart{
  position:fixed;
  color:#ff6b81;
  font-size:18px;
  pointer-events:none;
  animation:heartFloat 3s ease-out forwards;
}
@keyframes heartFloat{
  0%{transform:translateY(0) scale(1);opacity:1}
  100%{transform:translateY(220px) translateX(40px) scale(0.6);opacity:0}
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<div id="sentence"></div>

<div id="photo-screen">
  <div id="photo-frame">
    <img id="photo-img" src="shraddy.jpeg">
  </div>
  <p style="margin-top:20px;color:#b3e5fc;">the prettiest girl in the world ✦</p>
</div>

<script>

// 🎵 LOCAL AUDIO
const SONG_URL = "justoneday.mp3";

let audio = new Audio(SONG_URL);
audio.loop = true;
audio.volume = 0;

document.addEventListener("click", () => {
  audio.play().then(() => {
    let fade = setInterval(() => {
      if (audio.volume < 0.5) audio.volume += 0.02;
      else clearInterval(fade);
    }, 100);
  }).catch(()=>{});
}, { once: true });

// ✅ NEW SENTENCES STRUCTURE
const sentences = [
  { text:"Shraddy,", cls:"name" },
  { text:"I don't know what you might be going through right now, but I want you to remember something that never changes." },
  { text:"You are stronger than you think.", cls:"emphasis" },
  { text:"Life has a way of throwing things at us when we least expect it, but somehow, you always find a way to stand back up — even when it feels impossible." },
  { text:"That strength you carry so quietly?" },
  { text:"It's real, and it's powerful.", cls:"emphasis" },
  { text:"Even on days when everything feels heavy, when your thoughts get loud, or when you feel like you're not enough —" },
  { text:"you still are.", cls:"emphasis" },
  { text:"More than enough." },
  { text:"You've made it through things before that once felt like the end of the world, and you'll get through this too." },
  { text:"One step at a time. One breath at a time." },
  { text:"Just don't forget who you are in the middle of all this." },
  { text:"Don't lose that spark, that softness, that warmth that makes you you." },
  { text:"And most importantly —" },
  { text:"never lose your smile.", cls:"emphasis" },
  { text:"Because when you smile, you look like the prettiest girl in the world." },
  { text:"And she somewhat looks like this." }
];

let index=0;
let typing=false;
let glow=0;

const el=document.getElementById("sentence");
const photo=document.getElementById("photo-screen");

// TYPE + STYLE SUPPORT
function typeSentence(obj){
  typing=true;
  el.innerHTML="";
  el.className = obj.cls || "";
  el.classList.remove("exit");

  glow = 1;

  setTimeout(()=>{
    el.classList.add("visible");
  },50);

  const words=obj.text.split(" ");
  let i=0;

  function addWord(){
    if(i<words.length){
      el.innerHTML += words[i] + " ";
      i++;
      setTimeout(addWord, 80 + Math.random()*80);
    } else {
      typing=false;
    }
  }
  addWord();
}

function next(x,y){
  if(typing) return;

  spawnRipple(x,y);

  if(index < sentences.length){
    el.classList.remove("visible");
    el.classList.add("exit");

    setTimeout(()=>{
      typeSentence(sentences[index]);
      index++;
    },500);

  } else {
    el.style.display="none";
    photo.classList.add("show");
    startPhotoSparkles();
    launchHearts();
  }
}

document.addEventListener("click",e=>{
  next(e.clientX,e.clientY);
});

// ripple
function spawnRipple(x,y){
  let r=document.createElement("div");
  r.className="sparkle";
  r.style.left=x+"px";
  r.style.top=y+"px";
  r.style.width="120px";
  r.style.height="120px";
  r.style.background="rgba(79,195,247,0.15)";
  document.body.appendChild(r);
  setTimeout(()=>r.remove(),1000);
}

// sparkles
function createSparkle(x,y){
  const s=document.createElement("div");
  s.className="sparkle";
  const size=3+Math.random()*5;
  s.style.width=size+"px";
  s.style.height=size+"px";
  s.style.left=x+(Math.random()*6-3)+"px";
  s.style.top=y+(Math.random()*6-3)+"px";
  document.body.appendChild(s);
  setTimeout(()=>s.remove(),1000);
}

document.addEventListener("mousemove",(e)=>{
  createSparkle(e.clientX,e.clientY);
});

// photo sparkles
function startPhotoSparkles(){
  const frame=document.getElementById("photo-frame");

  setInterval(()=>{
    const rect=frame.getBoundingClientRect();

    for(let i=0;i<4;i++){
      const angle=Math.random()*Math.PI*2;
      const x=rect.left+rect.width/2 + Math.cos(angle)*(rect.width/1.7);
      const y=rect.top+rect.height/2 + Math.sin(angle)*(rect.height/1.7);
      createSparkle(x,y);
    }

  },160);
}

// hearts
function launchHearts(){
  for(let i=0;i<35;i++){
    setTimeout(()=>{
      const h=document.createElement("div");
      h.className="heart";
      h.innerHTML="❤";
      h.style.left=Math.random()*window.innerWidth+"px";
      h.style.top=(window.innerHeight/2)+"px";
      h.style.fontSize=(14+Math.random()*14)+"px";
      document.body.appendChild(h);
      setTimeout(()=>h.remove(),3000);
    },i*70);
  }
}

// background
const cv=document.getElementById("bg");
const ctx=cv.getContext("2d");
let W,H,t=0;

function resize(){
  W=cv.width=window.innerWidth;
  H=cv.height=window.innerHeight;
}
window.addEventListener("resize",resize);
resize();

function draw(){
  t+=0.006;
  glow*=0.96;

  let brightness = 1 + glow*0.4;

  let g=ctx.createLinearGradient(Math.sin(t)*W*0.2,0,W,H);
  g.addColorStop(0,`rgba(179,229,252,${brightness})`);
  g.addColorStop(0.5,`rgba(79,195,247,${brightness})`);
  g.addColorStop(1,`rgba(10,42,94,1)`);

  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  for(let i=0;i<4;i++){
    ctx.beginPath();
    ctx.moveTo(0,H/2);

    for(let x=0;x<W;x+=8){
      let y=H/2 + Math.sin(x*0.008 + t + i)*15*i;
      ctx.lineTo(x,y);
    }

    ctx.strokeStyle="rgba(255,255,255,0.04)";
    ctx.stroke();
  }

  requestAnimationFrame(draw);
}
draw();

</script>

</body>
</html>
